<script src="assets/js/main.min.js"></script>
<script>
  document.querySelectorAll(".profile-image-popup").forEach(function (link) {
    var card = document.getElementById(link.getAttribute("aria-controls"));
    if (typeof card.showModal !== "function") return;

    link.addEventListener("click", function (event) {
      event.preventDefault();
      card.showModal();
    });
    card.querySelector("button").addEventListener("click", function () {
      card.close();
    });
    card.addEventListener("click", function (event) {
      if (event.target === card) card.close();
    });
  });
</script>
