<script src="assets/js/main.min.js"></script>
<script>
  $(".profile-image-popup").magnificPopup({
    type: "image",
    closeOnContentClick: true,
    focus: ".mfp-close",
    callbacks: {
      open: function () {
        var label = this.currItem.el.text().trim() + " QR code";
        this.wrap.attr({role: "dialog", "aria-modal": "true", "aria-label": label});
        this.currItem.img.attr("alt", label);
      }
    }
  });
</script>
